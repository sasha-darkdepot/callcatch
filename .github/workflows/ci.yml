name: CI

on:
  push:
    branches: [main, callcatch]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version   # macos-15 default Xcode is 16.x (Swift 6)
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
